name: uva

services:
  bot:
    build: .
    image: uva-bot:latest
    env_file: .env
    environment:
      # Inside the compose network Mongo is reachable by its service name.
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/uva}
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    # No published ports: only the bot needs to reach it.

volumes:
  mongo-data:
