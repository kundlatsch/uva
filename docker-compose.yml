name: uva

# Shared by bot, worker and beat: same image, same configuration.
x-app: &app
  build:
    context: .
    target: app
  image: uva-bot:latest
  env_file: .env
  environment:
    # Inside the compose network services are reached by name.
    MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/uva}
    REDIS_URL: redis://redis:6379/0
    SECOND_BRAIN_PATH: /data/second-brain
    SQLITE_PATH: /data/sqlite/uva.db
    REPO_PATH: /repo
  volumes:
    - sqlite-data:/data/sqlite
    # The repository itself, so the bot can read/edit data/soul.md (and, later,
    # its own plugins) and commit those changes.
    - .:/repo
    # Second brain: a folder on the host (default ./brain, gitignored) so the
    # notes can be opened in Obsidian. Set SECOND_BRAIN_HOST_PATH to change it.
    - ${SECOND_BRAIN_HOST_PATH:-./brain}:/data/second-brain
  depends_on:
    - mongo
    - redis
  restart: unless-stopped

services:
  bot:
    <<: *app
    networks: [default, shellnet]

  worker:
    <<: *app
    networks: [default, shellnet]
    command: celery -A uva.tasks.app worker --loglevel=INFO --concurrency=2

  beat:
    <<: *app
    # Schedule state lives in /tmp: the schedule itself is defined in code.
    command: celery -A uva.tasks.app beat --loglevel=INFO --schedule /tmp/celerybeat-schedule

  # /projeto: Claude Code creating NEW projects. Only the projects folder is
  # mounted (never this repository or the second brain); see Dockerfile.
  projects:
    build:
      context: .
      target: projects
    image: uva-projects:latest
    env_file: .env
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/uva}
      REDIS_URL: redis://redis:6379/0
      PROJECTS_PATH: /data/projects
    volumes:
      # Default: a "uva-projects" folder next to this repository.
      - ${PROJECTS_HOST_PATH:-../uva-projects}:/data/projects
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  # /sh and /py: the bot's own folder /uva. Real isolation, not a prompt rule:
  # no .env, no repository/brain/projects, read-only root filesystem, no
  # capabilities for the commands (they run as the unprivileged "uva" user),
  # CPU/memory/process limits, and a network of its own ("shellnet" is internal:
  # only the bot and the worker reach it; "shell-internet" is for pip/curl and
  # can be cut with SHELL_NO_INTERNET=true).
  shell:
    build:
      context: .
      target: shell
    image: uva-shell:latest
    environment:
      SHELL_TIMEOUT_SECONDS: ${SHELL_TIMEOUT_SECONDS:-60}
    volumes:
      - uva-home:/uva
      - uva-snapshots:/snapshots
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      # Only the executor (root) uses these: to start commands as "uva", snapshot
      # and restore /uva, and stop runaway commands.
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${SHELL_MEMORY:-1g}
    cpus: ${SHELL_CPUS:-1}
    pids_limit: 256
    networks:
      - shellnet
      - shell-internet
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    # No published ports: only the app services need to reach it.

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped

networks:
  default: {}
  shellnet:
    internal: true
  shell-internet:
    internal: ${SHELL_NO_INTERNET:-false}

volumes:
  uva-home:
  uva-snapshots:
  mongo-data:
  redis-data:
  sqlite-data:
