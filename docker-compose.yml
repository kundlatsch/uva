name: uva

# Shared by bot, worker and beat: same image, same configuration.
x-app: &app
  build:
    context: .
    target: app
  image: uva-bot:latest
  env_file: .env
  environment:
    # Inside the compose network services are reached by name.
    MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/uva}
    REDIS_URL: redis://redis:6379/0
    SECOND_BRAIN_PATH: /data/second-brain
    SQLITE_PATH: /data/sqlite/uva.db
    REPO_PATH: /repo
  volumes:
    - sqlite-data:/data/sqlite
    # The repository itself, so the bot can read/edit data/soul.md (and, later,
    # its own plugins) and commit those changes.
    - .:/repo
    # Second brain: a folder on the host (default ./brain, gitignored) so the
    # notes can be opened in Obsidian. Set SECOND_BRAIN_HOST_PATH to change it.
    - ${SECOND_BRAIN_HOST_PATH:-./brain}:/data/second-brain
  depends_on:
    - mongo
    - redis
  restart: unless-stopped

services:
  bot:
    <<: *app

  worker:
    <<: *app
    command: celery -A uva.tasks.app worker --loglevel=INFO --concurrency=2

  beat:
    <<: *app
    # Schedule state lives in /tmp: the schedule itself is defined in code.
    command: celery -A uva.tasks.app beat --loglevel=INFO --schedule /tmp/celerybeat-schedule

  # /projeto: Claude Code creating NEW projects. Only the projects folder is
  # mounted (never this repository or the second brain); see Dockerfile.
  projects:
    build:
      context: .
      target: projects
    image: uva-projects:latest
    env_file: .env
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/uva}
      REDIS_URL: redis://redis:6379/0
      PROJECTS_PATH: /data/projects
    volumes:
      # Default: a "uva-projects" folder next to this repository.
      - ${PROJECTS_HOST_PATH:-../uva-projects}:/data/projects
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    # No published ports: only the app services need to reach it.

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:
  sqlite-data:
