[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "uva"
version = "0.1.0"
description = "UVA: assistente pessoal via Telegram"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=21.0,<23",
    "pydantic-settings>=2.4,<3",
    "structlog>=24.1",
    "pymongo>=4.10,<5",
    "tzdata>=2024.1",
    "rapidfuzz>=3.9",
    "anthropic>=1.0,<2",
    "openai>=3.26,<4",  # 3.26+ has client.decisions
    "httpx>=0.27",
    "ddgs>=9.0",
    "celery[redis]>=5.4,<6",
    "redis>=5",
    "pyyaml>=6",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "jsonschema>=4.20,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# The MCP gateway (uva/mcp/gateway.py); pinned: servers are third-party code.
mcp = [
    "mcp==2.3.0",
    "mcp-types==2.3.0",
]

[project.scripts]
uva = "uva.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"uva.dashboard" = ["static/*"]
# Translations (see uva/i18n.py).
"uva" = ["locales/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
