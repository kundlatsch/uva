[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "uva"
version = "0.1.0"
description = "UVA: assistente pessoal via Telegram"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=21.0,<23",
    "pydantic-settings>=2.4,<3",
    "structlog>=24.1",
    "pymongo>=4.10,<5",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
uva = "uva.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
